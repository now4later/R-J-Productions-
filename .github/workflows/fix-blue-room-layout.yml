name: Fix Blue Room layout

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update gallery and Blue Room image fit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          old_blue = '<img src="/blue-room.jpg" alt="The Blue Room performance venue" loading="lazy" style="width:100%;height:100%;object-fit:cover;object-position:center;display:block;">'
          new_blue = '<img src="/blue-room.jpg" alt="The Blue Room performance venue" loading="lazy" style="width:100%;height:100%;object-fit:contain;object-position:center;display:block;">'
          html = html.replace(old_blue, new_blue)

          marker = '''          <article class="tile">\n            <div class="ph" style="background:#090812;">\n              <img src="/Messenger_creation_D827BE4B-2FF7-44CC-A9E3-DC6F17AE98DA.jpeg" alt="R&J Productions live at The Blue Room" loading="lazy" style="width:100%;height:100%;object-fit:contain;object-position:center;display:block;">\n            </div>\n          </article>\n'''
          fourth = marker + '''          <article class="tile">\n            <div class="ph" style="background:#090812;">\n              <img src="/blue-room.jpg" alt="The Blue Room performance venue" loading="lazy" style="width:100%;height:100%;object-fit:contain;object-position:center;display:block;">\n            </div>\n          </article>\n'''
          if '/blue-room.jpg" alt="The Blue Room performance venue" loading="lazy" style="width:100%;height:100%;object-fit:contain' not in html.split('<div class="highlights-grid" id="highlights">', 1)[1].split('</div>\n      </div>\n    </section>', 1)[0]:
              html = html.replace(marker, fourth, 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No layout changes needed."
            exit 0
          fi
          git commit -m "Add Blue Room photo to gallery and fit image"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-blue-room-layout.yml
          git add .github/workflows/fix-blue-room-layout.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove temporary Blue Room layout workflow"
          git push
