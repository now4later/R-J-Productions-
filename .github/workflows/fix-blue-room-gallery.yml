name: Fix Blue Room gallery

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove duplicate Blue Room gallery image
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          duplicate = '''          <article class="tile">\n            <div class="ph" style="background:#090812;">\n              <img src="/blue-room.jpg" alt="The Blue Room performance venue" loading="lazy" style="width:100%;height:100%;object-fit:contain;object-position:center;display:block;">\n            </div>\n          </article>\n'''

          gallery_start = html.find('<div class="highlights-grid" id="highlights">')
          gallery_end = html.find('</div>\n      </div>\n    </section>', gallery_start)
          if gallery_start == -1 or gallery_end == -1:
              raise SystemExit('Gallery section not found')

          gallery = html[gallery_start:gallery_end]
          if duplicate in gallery:
              gallery = gallery.replace(duplicate, '', 1)
              html = html[:gallery_start] + gallery + html[gallery_end:]
              path.write_text(html, encoding='utf-8')
          else:
              print('Duplicate Blue Room gallery image not found; no change needed.')
          PY

      - name: Commit website fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-blue-room-gallery.yml
          git rm .github/workflows/fix-blue-room-gallery.yml
          git commit -m "Remove duplicate Blue Room gallery photo"
          git push
